name: Deploy to Docker
on:
  push:
    branches: [main, deploy-test]
  workflow_dispatch:
    inputs:
      target:
        description: "Target"
        required: true
        default: "production"
        type: choice
        options:
          - "production"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # TODO: Update with your GitHub username or organization
  GHCR_ORG: "dabblingwithcode"

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./etc/docker/Dockerfile
          push: true
          tags: ghcr.io/${{ env.GHCR_ORG }}/matrix-corporal:latest
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

  deploy:
    needs: build-and-push-image
    name: Deploy to production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH keys
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Add SSH key to the agent
        run: |
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Test SSH connection
        run: >
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          "echo SSH connection successful"

      - name: Substitute secrets in Synapse config
        run: |
          export MATRIX_SERVER_NAME="${{ secrets.MATRIX_SERVER_NAME }}"
          export MATRIX_AUTH_SHARED_SECRET="${{ secrets.MATRIX_AUTH_SHARED_SECRET }}"
          export MATRIX_REGISTRATION_SHARED_SECRET="${{ secrets.MATRIX_REGISTRATION_SHARED_SECRET }}"
          export MATRIX_MACAROON_SECRET_KEY="${{ secrets.MATRIX_MACAROON_SECRET_KEY }}"
          export MATRIX_FORM_SECRET="${{ secrets.MATRIX_FORM_SECRET }}"
          export POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
          export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
          export POSTGRES_DB="${{ secrets.POSTGRES_DB }}"
          envsubst < etc/docker/synapse/homeserver.production.yaml > etc/docker/synapse/homeserver.production.yaml.out
          mv etc/docker/synapse/homeserver.production.yaml.out etc/docker/synapse/homeserver.production.yaml

      - name: Substitute secrets in matrix-corporal config
        run: |
          export MATRIX_SERVER_NAME="${{ secrets.MATRIX_SERVER_NAME }}"
          export MATRIX_AUTH_SHARED_SECRET="${{ secrets.MATRIX_AUTH_SHARED_SECRET }}"
          export MATRIX_REGISTRATION_SHARED_SECRET="${{ secrets.MATRIX_REGISTRATION_SHARED_SECRET }}"
          export CORPORAL_API_TOKEN="${{ secrets.CORPORAL_API_TOKEN }}"
          envsubst < etc/docker/corporal/config.production.json > etc/docker/corporal/config.production.json.out
          mv etc/docker/corporal/config.production.json.out etc/docker/corporal/config.production.json

      - name: Substitute secrets in Element-web config
        run: |
          export MATRIX_SERVER_NAME="${{ secrets.MATRIX_SERVER_NAME }}"
          envsubst < etc/docker/element-web/config.production.json > etc/docker/element-web/config.production.json.out
          mv etc/docker/element-web/config.production.json.out etc/docker/element-web/config.production.json

      - name: Copy deployment files to VPS
        run: |
          rsync -avz --delete \
            --exclude='synapse/signing.key' \
            -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            etc/docker/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/matrix-corporal/docker/

          rsync -avz \
            -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            etc/services/shared_secret_authenticator.py \
            etc/services/rest_auth_provider.py \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/matrix-corporal/docker/

      - name: Pull images and start services on VPS
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin && \
             cd ~/matrix-corporal/docker && \
             POSTGRES_USER='${{ secrets.POSTGRES_USER }}' \
             POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
             POSTGRES_DB='${{ secrets.POSTGRES_DB }}' \
             MATRIX_SERVER_NAME='${{ secrets.MATRIX_SERVER_NAME }}' \
             ACME_EMAIL='${{ secrets.ACME_EMAIL }}' \
             GHCR_ORG='${{ env.GHCR_ORG }}' \
             docker compose -f compose.production.yml -p matrix-corporal pull && \
             POSTGRES_USER='${{ secrets.POSTGRES_USER }}' \
             POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
             POSTGRES_DB='${{ secrets.POSTGRES_DB }}' \
             MATRIX_SERVER_NAME='${{ secrets.MATRIX_SERVER_NAME }}' \
             ACME_EMAIL='${{ secrets.ACME_EMAIL }}' \
             GHCR_ORG='${{ env.GHCR_ORG }}' \
             docker compose -f compose.production.yml -p matrix-corporal up -d"

      - name: Wait for Synapse to be ready
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'for i in $(seq 1 30); do
               if docker exec matrix-corporal-synapse-1 wget -q --spider http://localhost:8008/_matrix/client/versions 2>/dev/null; then
                 echo "Synapse is ready"; exit 0
               fi
               echo "Waiting for Synapse... ($i/30)"; sleep 2
             done
             echo "Synapse did not become ready in time"; exit 1'

      - name: Create admin user if not exists
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'ADMIN_ID="${{ secrets.MATRIX_ADMIN_ID }}"
             ADMIN_PW="${{ secrets.MATRIX_ADMIN_PASSWORD }}"
             CONTAINER="matrix-corporal-synapse-1"

             RESULT=$(docker exec "$CONTAINER" \
               python -c "
             import requests, sys
             try:
                 r = requests.get(\"http://localhost:8008/_synapse/admin/v2/users/@${ADMIN_ID}:${{ secrets.MATRIX_SERVER_NAME }}\",
                     headers={\"Authorization\": \"Bearer invalid\"})
                 if r.status_code == 401:
                     print(\"need_auth\")
                 elif r.status_code == 200:
                     print(\"exists\")
                 else:
                     print(\"unknown\")
             except Exception as e:
                 print(\"error\")
             " 2>/dev/null || echo "error")

             if docker exec "$CONTAINER" python -c "
             import requests, json, hashlib, hmac
             reg_secret = \"${{ secrets.MATRIX_REGISTRATION_SHARED_SECRET }}\"
             r = requests.get(\"http://localhost:8008/_synapse/admin/v1/register\")
             nonce = r.json()[\"nonce\"]
             mac = hmac.new(reg_secret.encode(), digestmod=hashlib.sha1)
             mac.update(nonce.encode())
             mac.update(b\"\\x00\")
             mac.update(\"${ADMIN_ID}\".encode())
             mac.update(b\"\\x00\")
             mac.update(\"${ADMIN_PW}\".encode())
             mac.update(b\"\\x00\")
             mac.update(b\"admin\")
             mac_hex = mac.hexdigest()
             data = {\"nonce\": nonce, \"username\": \"${ADMIN_ID}\", \"password\": \"${ADMIN_PW}\", \"admin\": True, \"mac\": mac_hex}
             r2 = requests.post(\"http://localhost:8008/_synapse/admin/v1/register\", json=data)
             if r2.status_code == 200:
                 print(\"Admin user created successfully\")
             elif \"User ID already taken\" in r2.text:
                 print(\"Admin user already exists - skipping\")
             else:
                 print(f\"Registration response: {r2.status_code} {r2.text}\")
                 if r2.status_code >= 400 and \"already taken\" not in r2.text:
                     exit(1)
             "; then
               echo "Admin user step completed"
             else
               echo "Warning: Admin user creation had issues, check logs"
             fi'

      - name: Cleanup
        run: rm -rf ~/.ssh
